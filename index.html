<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>함포대전 : 대항해시대</title>
<style>
  :root{
    --navy-deep:#062338;
    --navy:#0c3a5c;
    --wood-dark:#2b1a10;
    --wood:#4a2f1c;
    --wood-light:#7a4f2b;
    --parchment:#e9d7ad;
    --gold:#e0b84b;
    --red:#b33f2c;
    --green:#3f8f5a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:var(--navy-deep);
    font-family:"Trebuchet MS","Malgun Gothic",sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #app{
    position:fixed; inset:0; display:flex; flex-direction:column;
    background:var(--navy-deep);
  }
  /* ---------- AD SLOTS ---------- */
  .ad-slot{
    flex:0 0 auto; width:100%; display:flex; align-items:center; justify-content:center;
    background:repeating-linear-gradient(45deg,#20313f,#20313f 10px,#1a2833 10px,#1a2833 20px);
    color:#9fb3c2; font-size:12px; letter-spacing:1px; border-bottom:1px solid #0006;
    overflow:hidden;
  }
  #adTop{ height:50px; }
  /* AdSense/애드핏 등 실제 광고 코드는 이 div 내부에 삽입하세요 */

  /* ---------- CANVAS / HUD ---------- */
  #stage{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  #hud{
    position:absolute; top:8px; left:8px; right:8px; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; font-weight:bold; color:var(--parchment);
    text-shadow:0 2px 3px rgba(0,0,0,.8);
  }
  #hearts{ display:flex; gap:3px; font-size:20px; }
  #hearts span.dead{ opacity:.25; filter:grayscale(1); }
  #midInfo{ text-align:center; }
  #scoreVal{ font-size:20px; }
  #timeVal{ font-size:14px; opacity:.9; }
  #muteBtn{
    pointer-events:auto; background:rgba(0,0,0,.35); border:1px solid #ffffff55;
    color:var(--parchment); border-radius:8px; padding:4px 8px; font-size:16px;
  }

  #fireBtn{
    position:absolute; right:18px; bottom:18px; z-index:6;
    width:84px; height:84px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e2793f, var(--red) 70%);
    border:3px solid #ffe6b8cc; color:#fff3dc; font-size:14px; font-weight:bold;
    box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 -4px 6px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    line-height:1.1; touch-action:manipulation;
  }
  #fireBtn:active{ transform:scale(0.93); filter:brightness(0.9); }

  #hint{
    position:absolute; left:0; right:0; bottom:16px; text-align:center; z-index:4;
    color:#ffffffcc; font-size:12px; text-shadow:0 1px 3px #000; pointer-events:none;
    transition:opacity .6s;
  }

  /* ---------- OVERLAYS ---------- */
  .overlay{
    position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:rgba(3,15,25,.72); backdrop-filter:blur(2px);
  }
  .overlay.hidden{ display:none; }
  .card{
    width:min(360px,88vw); max-height:90%; overflow:auto;
    background:linear-gradient(180deg,var(--wood-light),var(--wood) 60%,var(--wood-dark));
    border:4px solid var(--gold); border-radius:14px; padding:22px 20px;
    color:var(--parchment); text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  .card h1{ margin:0 0 6px; font-size:26px; color:var(--gold); text-shadow:0 2px 2px #0008;}
  .card h2{ margin:4px 0 10px; font-size:20px; color:var(--gold);}
  .card p{ font-size:13px; line-height:1.6; margin:6px 0; opacity:.95;}
  .card .stat{ font-size:15px; margin:4px 0; }
  .card .stat b{ color:var(--gold); font-size:22px; }
  .btn{
    display:inline-block; margin-top:14px; padding:12px 26px; font-size:16px; font-weight:bold;
    background:linear-gradient(180deg,#ffd873,var(--gold)); color:#3a2205; border:2px solid #7a4f0f;
    border-radius:10px; cursor:pointer; box-shadow:0 4px 0 #7a4f0f, 0 6px 10px rgba(0,0,0,.4);
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #7a4f0f; }
  .ship-emoji{ font-size:42px; margin:6px 0; }

  .ad-slot.inline{
    margin-top:16px; height:100px; border-radius:8px; border:1px dashed #ffffff55;
  }
</style>
</head>
<body>
<div id="app">
  <div id="adTop" class="ad-slot">광고 영역 · AD (320x50)</div>

  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="hearts"></div>
      <div id="midInfo">
        <div id="scoreVal">0</div>
        <div id="timeVal">90</div>
      </div>
      <button id="muteBtn">🔊</button>
    </div>

    <div id="hint">화면을 드래그해서 함선을 이동, 버튼으로 발사!</div>

    <button id="fireBtn">🔥<br>발사</button>

    <div id="startScreen" class="overlay">
      <div class="card">
        <div class="ship-emoji">⚓🏴‍☠️</div>
        <h1>함포대전</h1>
        <p style="opacity:.8">- 대항해시대 해상 포격전 -</p>
        <p>화면을 드래그해 내 함선을 위/아래로 조종하고,<br>
        오른쪽 발사 버튼으로 함포를 쏴 적선을 격침하세요.<br>
        적탄에 맞으면 체력이 줄어듭니다. 제한시간 안에<br>최대한 많은 배를 격침시키세요!</p>
        <div class="stat">최고 점수: <b id="bestScoreStart">0</b></div>
        <button id="startBtn" class="btn">▶ 항해 시작</button>
      </div>
    </div>

    <div id="endScreen" class="overlay hidden">
      <div class="card">
        <div class="ship-emoji" id="endEmoji">💥</div>
        <h2 id="endTitle">격침당했습니다...</h2>
        <div class="stat">이번 점수: <b id="finalScore">0</b></div>
        <div class="stat">최고 점수: <b id="bestScoreEnd">0</b></div>
        <div class="ad-slot inline">광고 영역 · AD (전면/네이티브)</div>
        <button id="retryBtn" class="btn">↻ 다시 하기</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============== 기본 세팅 ============== */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    var w = stage.clientWidth, h = stage.clientHeight;
    canvas.width = Math.floor(w * DPR);
    canvas.height = Math.floor(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    W = w; H = h;
  }
  var W = 0, H = 0;
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,150); });

  /* ============== 사운드 (WebAudio, 외부 파일 없음) ============== */
  var AC = null, muted = (localStorage.getItem('cg_muted') === '1');
  function audioCtx(){
    if(!AC){
      try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; }
    }
    return AC;
  }
  function beep(freq, dur, type, vol, delay){
    if(muted) return;
    var ac = audioCtx();
    if(!ac) return;
    try{
      var t0 = ac.currentTime + (delay||0);
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(vol||0.15, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(t0); osc.stop(t0+dur+0.05);
    }catch(e){}
  }
  function sfxFire(){ beep(220,0.12,'square',0.12); beep(140,0.18,'sawtooth',0.08,0.02); }
  function sfxHit(){ beep(500,0.08,'square',0.1); }
  function sfxSink(){ beep(180,0.35,'sawtooth',0.15); beep(90,0.4,'sawtooth',0.12,0.05); }
  function sfxDamage(){ beep(110,0.3,'sawtooth',0.18); }
  function sfxGameOver(){ beep(220,0.25,'sawtooth',0.15); beep(160,0.3,'sawtooth',0.15,0.2); beep(100,0.5,'sawtooth',0.15,0.4); }
  function sfxVictory(){ [523,659,784,1047].forEach(function(f,i){ beep(f,0.22,'square',0.13,i*0.12); }); }

  var muteBtn = document.getElementById('muteBtn');
  function refreshMuteBtn(){ muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMuteBtn();
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    localStorage.setItem('cg_muted', muted ? '1':'0');
    refreshMuteBtn();
  });

  /* ============== 게임 상수 ============== */
  var TIME_LIMIT = 90;
  var PLAYER_MAX_HP = 5;
  var BULLET_SPEED_P = 560;
  var BULLET_SPEED_E = 300;
  var INVULN_TIME = 1.0;

  var ENEMY_TYPES = {
    sloop:   { w:46, h:30, hp:1, speed:120, score:50,  color:'#8a3b3b', weight:5 },
    frigate: { w:64, h:40, hp:2, speed:85,  score:100, color:'#7a2f2f', weight:3 },
    galleon: { w:86, h:54, hp:4, speed:55,  score:200, color:'#5c2323', weight:1.4 }
  };

  /* ============== 게임 상태 ============== */
  var state = 'ready'; // ready | playing | over
  var player, bullets, enemies, particles, splashes;
  var score = 0, timeLeft = TIME_LIMIT, elapsed = 0, spawnTimer = 0;
  var fireCooldown = 0;
  var shake = 0;
  var waveT = 0;
  var lastResult = null; // 'win' | 'lose'

  function bestScore(){ return parseInt(localStorage.getItem('cg_best')||'0',10); }
  function setBest(v){ localStorage.setItem('cg_best', String(v)); }

  function resetGame(){
    player = { x:70, y:H/2, targetY:H/2, w:60, h:34, hp:PLAYER_MAX_HP, invuln:0 };
    bullets = [];
    enemies = [];
    particles = [];
    splashes = [];
    score = 0; timeLeft = TIME_LIMIT; elapsed = 0; spawnTimer = 1.2;
    fireCooldown = 0; shake = 0;
  }

  /* ============== 입력 ============== */
  var pointerActive = false;
  function setTargetFromClientY(clientY){
    var rect = canvas.getBoundingClientRect();
    var y = clientY - rect.top;
    var margin = 30;
    player.targetY = Math.max(margin, Math.min(H - margin, y));
  }
  stage.addEventListener('pointerdown', function(e){
    if(e.target.id === 'fireBtn' || e.target.id === 'muteBtn') return;
    pointerActive = true;
    setTargetFromClientY(e.clientY);
  });
  stage.addEventListener('pointermove', function(e){
    if(!pointerActive) return;
    setTargetFromClientY(e.clientY);
  });
  window.addEventListener('pointerup', function(){ pointerActive = false; });

  window.addEventListener('keydown', function(e){
    if(state !== 'playing') return;
    if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') player.targetY = Math.max(30, player.targetY - 40);
    if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') player.targetY = Math.min(H-30, player.targetY + 40);
    if(e.key === ' '){ e.preventDefault(); doFire(); }
  });

  var fireBtn = document.getElementById('fireBtn');
  function fireDown(e){ e.preventDefault(); doFire(); }
  fireBtn.addEventListener('pointerdown', fireDown);

  function doFire(){
    if(state !== 'playing') return;
    if(fireCooldown > 0) return;
    fireCooldown = 0.32;
    bullets.push({ x:player.x + player.w*0.55, y:player.y, vx:BULLET_SPEED_P, r:5, from:'player' });
    sfxFire();
    shake = Math.max(shake, 2);
  }

  /* ============== 스폰 ============== */
  function pickEnemyType(prog){
    var keys = Object.keys(ENEMY_TYPES);
    var weights = keys.map(function(k){
      var base = ENEMY_TYPES[k].weight;
      if(k === 'galleon') base += prog*3;
      if(k === 'frigate') base += prog*1.5;
      return base;
    });
    var total = weights.reduce(function(a,b){return a+b;},0);
    var r = Math.random()*total;
    for(var i=0;i<keys.length;i++){
      r -= weights[i];
      if(r<=0) return keys[i];
    }
    return keys[0];
  }

  function spawnEnemy(){
    var prog = Math.min(1, elapsed / TIME_LIMIT);
    var type = pickEnemyType(prog);
    var t = ENEMY_TYPES[type];
    var margin = 50;
    var y = margin + Math.random()*(H - margin*2);
    var speedMul = 1 + prog*0.5;
    enemies.push({
      type:type, x: W + t.w, y:y, w:t.w, h:t.h,
      hp:t.hp, maxHp:t.hp, speed:t.speed*speedMul, color:t.color,
      score:t.score, shotCd: 1 + Math.random()*1.5, alive:true
    });
  }

  /* ============== 파티클 ============== */
  function explode(x,y,color,count,power){
    for(var i=0;i<count;i++){
      var ang = Math.random()*Math.PI*2;
      var spd = (0.5+Math.random())*(power||120);
      particles.push({
        x:x,y:y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
        life:0.35+Math.random()*0.35, age:0,
        r: 2+Math.random()*4, color: color
      });
    }
  }
  function splash(x,y){
    splashes.push({ x:x, y:y, age:0, life:0.4, r:6 });
  }

  /* ============== 업데이트 ============== */
  function update(dt){
    elapsed += dt;
    timeLeft = Math.max(0, TIME_LIMIT - elapsed);
    waveT += dt;
    if(shake > 0) shake = Math.max(0, shake - dt*8);
    if(fireCooldown > 0) fireCooldown -= dt;
    if(player.invuln > 0) player.invuln -= dt;

    // 플레이어 이동 (부드럽게 목표지점 추적)
    player.y += (player.targetY - player.y) * Math.min(1, dt*8);

    // 스폰
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnEnemy();
      var prog = Math.min(1, elapsed/TIME_LIMIT);
      spawnTimer = Math.max(0.55, 1.5 - prog*0.9) + Math.random()*0.4;
    }

    // 총알 이동/충돌
    for(var i=bullets.length-1;i>=0;i--){
      var b = bullets[i];
      b.x += b.vx*dt;
      var hit = false;

      if(b.from === 'player'){
        for(var j=0;j<enemies.length;j++){
          var en = enemies[j];
          if(!en.alive) continue;
          if(Math.abs(b.x-en.x) < en.w*0.5 && Math.abs(b.y-en.y) < en.h*0.5){
            en.hp -= 1;
            explode(b.x,b.y,'#ffcf6b',8,140);
            sfxHit();
            hit = true;
            if(en.hp <= 0){
              en.alive = false;
              score += en.score;
              explode(en.x,en.y,'#ffa552',22,220);
              shake = Math.max(shake,6);
              sfxSink();
            }
            break;
          }
        }
        if(b.x > W+20) hit = true;
      } else {
        if(player.invuln <= 0 &&
           Math.abs(b.x-player.x) < player.w*0.5 && Math.abs(b.y-player.y) < player.h*0.5){
          player.hp -= 1;
          player.invuln = INVULN_TIME;
          explode(player.x,player.y,'#ff8a5c',16,180);
          shake = Math.max(shake,8);
          sfxDamage();
          hit = true;
        }
        if(b.x < -20) hit = true;
      }

      if(hit){
        if(!(b.from==='player')) {} // no-op
        splash(b.x,b.y);
        bullets.splice(i,1);
      }
    }

    // 적 이동/발사/충돌(램)
    for(var k=enemies.length-1;k>=0;k--){
      var e2 = enemies[k];
      if(!e2.alive){ enemies.splice(k,1); continue; }
      e2.x -= e2.speed*dt;

      e2.shotCd -= dt;
      if(e2.shotCd <= 0 && e2.x < W-40 && e2.x > player.x+40){
        e2.shotCd = 1.4 + Math.random()*1.6;
        bullets.push({ x:e2.x-e2.w*0.5, y:e2.y + (Math.random()*20-10), vx:-BULLET_SPEED_E, r:4.5, from:'enemy' });
      }

      // 램밍(충돌)
      if(player.invuln<=0 && Math.abs(e2.x-player.x) < (e2.w*0.5+player.w*0.4) &&
         Math.abs(e2.y-player.y) < (e2.h*0.5+player.h*0.4)){
        player.hp -= 1;
        player.invuln = INVULN_TIME;
        explode(player.x,player.y,'#ff8a5c',20,200);
        e2.alive = false;
        shake = Math.max(shake,10);
        sfxDamage();
      }

      if(e2.x < -e2.w-30){ enemies.splice(k,1); }
    }

    // 파티클
    for(var p=particles.length-1;p>=0;p--){
      var pt = particles[p];
      pt.age += dt;
      if(pt.age >= pt.life){ particles.splice(p,1); continue; }
      pt.x += pt.vx*dt; pt.y += pt.vy*dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
    }
    for(var s=splashes.length-1;s>=0;s--){
      splashes[s].age += dt;
      if(splashes[s].age >= splashes[s].life) splashes.splice(s,1);
    }

    // 종료 조건
    if(player.hp <= 0){
      endGame('lose');
    } else if(timeLeft <= 0){
      endGame('win');
    }

    updateHUD();
  }

  /* ============== 그리기 ============== */
  function drawShip(x,y,w,h,color,dir,invulnFlash){
    ctx.save();
    ctx.translate(x,y);
    if(invulnFlash) ctx.globalAlpha = 0.5 + 0.5*Math.sin(elapsed*30);
    var bow = dir*w*0.5;
    var back = -dir*w*0.5;
    var taper = dir*w*0.18;

    // 선체
    ctx.beginPath();
    ctx.moveTo(back, -h*0.5);
    ctx.lineTo(bow-taper, -h*0.5);
    ctx.lineTo(bow, 0);
    ctx.lineTo(bow-taper, h*0.5);
    ctx.lineTo(back, h*0.5);
    ctx.closePath();
    var grad = ctx.createLinearGradient(0,-h*0.5,0,h*0.5);
    grad.addColorStop(0, color);
    grad.addColorStop(1, '#000000aa');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#00000066';
    ctx.stroke();

    // 갑판 라인
    ctx.strokeStyle = '#00000033';
    ctx.beginPath();
    ctx.moveTo(back, -h*0.15); ctx.lineTo(bow-taper*1.3, -h*0.15);
    ctx.stroke();

    // 돛대 + 돛
    var mastX = -dir*w*0.05;
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(mastX, -h*0.5);
    ctx.lineTo(mastX, -h*1.7);
    ctx.stroke();

    ctx.fillStyle = '#f2e6c9ee';
    ctx.beginPath();
    ctx.moveTo(mastX, -h*1.6);
    ctx.quadraticCurveTo(mastX + dir*w*0.42, -h*1.15, mastX, -h*0.55);
    ctx.quadraticCurveTo(mastX + dir*w*0.14, -h*1.1, mastX, -h*1.6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#00000022'; ctx.lineWidth=1; ctx.stroke();

    // 깃발
    ctx.fillStyle = dir>0 ? '#3f6fb0' : '#8a2020';
    ctx.beginPath();
    ctx.moveTo(mastX, -h*1.7);
    ctx.lineTo(mastX + dir*14, -h*1.62);
    ctx.lineTo(mastX, -h*1.54);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawHPBar(x,y,w,h,hp,maxHp){
    var bw = w, bh = 5;
    var bx = x-bw/2, by = y-h*0.5-14;
    ctx.fillStyle = '#00000088';
    ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle = hp/maxHp > 0.4 ? '#5fd66b' : '#e05b3f';
    ctx.fillRect(bx,by,bw*Math.max(0,hp/maxHp),bh);
    ctx.strokeStyle = '#000000aa'; ctx.lineWidth=1;
    ctx.strokeRect(bx,by,bw,bh);
  }

  function drawOcean(){
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0e4a72');
    g.addColorStop(1,'#082f4c');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = '#bfe4ff';
    for(var row=0; row<6; row++){
      var yy = (row+0.5) * (H/6);
      ctx.beginPath();
      for(var x=0;x<=W;x+=14){
        var yOff = Math.sin((x*0.02)+(waveT*1.4)+row) * 5;
        if(x===0) ctx.moveTo(x, yy+yOff); else ctx.lineTo(x, yy+yOff);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw(){
    ctx.save();
    if(shake>0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    drawOcean();

    // 스플래시
    splashes.forEach(function(s){
      var a = 1 - s.age/s.life;
      ctx.strokeStyle = 'rgba(220,240,255,'+(a*0.8)+')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r + (s.age/s.life)*16, 0, Math.PI*2);
      ctx.stroke();
    });

    // 적선
    enemies.forEach(function(e){
      drawShip(e.x,e.y,e.w,e.h,e.color,-1,false);
      drawHPBar(e.x,e.y,e.w*0.8,e.h,e.hp,e.maxHp);
    });

    // 플레이어
    if(state !== 'ready'){
      drawShip(player.x,player.y,player.w,player.h,'#2f5f8a',1, player.invuln>0);
    }

    // 총알
    bullets.forEach(function(b){
      ctx.beginPath();
      ctx.fillStyle = b.from==='player' ? '#3a2a1a' : '#d94f3a';
      ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#00000055'; ctx.lineWidth=1; ctx.stroke();
    });

    // 파티클
    particles.forEach(function(p){
      var a = 1 - p.age/p.life;
      ctx.globalAlpha = Math.max(0,a);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    ctx.restore();
  }

  /* ============== HUD ============== */
  var heartsEl = document.getElementById('hearts');
  var scoreEl = document.getElementById('scoreVal');
  var timeEl = document.getElementById('timeVal');
  function updateHUD(){
    var hp = state==='ready' ? PLAYER_MAX_HP : player.hp;
    var html = '';
    for(var i=0;i<PLAYER_MAX_HP;i++){
      html += '<span class="'+(i<hp?'':'dead')+'">❤️</span>';
    }
    heartsEl.innerHTML = html;
    scoreEl.textContent = score + ' 점';
    timeEl.textContent = '⏳ ' + Math.ceil(timeLeft) + '초';
  }

  /* ============== 루프 ============== */
  var lastT = null;
  function loop(ts){
    if(lastT===null) lastT = ts;
    var dt = Math.min(0.05, (ts-lastT)/1000);
    lastT = ts;

    if(state === 'playing'){
      update(dt);
    } else {
      waveT += dt;
    }
    draw();
    requestAnimationFrame(loop);
  }

  /* ============== 화면 전환 ============== */
  var startScreen = document.getElementById('startScreen');
  var endScreen = document.getElementById('endScreen');
  var hint = document.getElementById('hint');

  function startGame(){
    resetGame();
    state = 'playing';
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    updateHUD();
    var ac = audioCtx();
    if(ac && ac.state === 'suspended') ac.resume();
    hint.style.opacity = '1';
    setTimeout(function(){ hint.style.opacity = '0'; }, 3200);
  }

  function endGame(result){
    if(state !== 'playing') return;
    state = 'over';
    lastResult = result;
    var best = bestScore();
    if(score > best){ best = score; setBest(best); }

    document.getElementById('finalScore').textContent = score + ' 점';
    document.getElementById('bestScoreEnd').textContent = best + ' 점';

    if(result === 'win'){
      document.getElementById('endEmoji').textContent = '🏆';
      document.getElementById('endTitle').textContent = '항해 성공! 무사 귀환';
      sfxVictory();
    } else {
      document.getElementById('endEmoji').textContent = '💥';
      document.getElementById('endTitle').textContent = '격침당했습니다...';
      sfxGameOver();
    }
    setTimeout(function(){ endScreen.classList.remove('hidden'); }, 600);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('bestScoreStart').textContent = bestScore() + ' 점';

  /* ============== 초기화 ============== */
  resize();
  resetGame();
  updateHUD();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
